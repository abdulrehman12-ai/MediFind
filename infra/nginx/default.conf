log_format medifind_access '$remote_addr $request_method $uri $status $body_bytes_sent rt=$request_time rid=$upstream_http_x_request_id';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 8m;

    access_log /var/log/nginx/access.log medifind_access;
    error_log /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_REQUEST_ID "";
        set $medifind_fpm app:9000;
        fastcgi_pass $medifind_fpm;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    location ~ \.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
