version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: composer

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: npm

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
