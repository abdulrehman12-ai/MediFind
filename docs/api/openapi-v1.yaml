openapi: 3.0.3
info:
  title: MediFind API
  version: 1.0.0
  description: >
    Customer API contract through Phase 4 prescription understanding. This document is
    validated for structure, route alignment, and the critical response
    fields below. It is not a full schema certification.
servers:
  - url: /
paths:
  /api/v1/health/live:
    get:
      operationId: healthLive
      responses:
        '200':
          description: Process is alive
  /api/v1/health/ready:
    get:
      operationId: healthReady
      responses:
        '200':
          description: Dependencies are ready
        '503':
          description: A dependency is unavailable
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestBody'
      responses:
        '202':
          description: Challenge accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestSuccess'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: otp_unavailable when the OTP store is unavailable, or otp_delivery_unavailable when delivery fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyBody'
      responses:
        '200':
          description: Customer token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerificationSuccess'
        '403':
          description: account_role_forbidden or account_inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Code or input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Verification already in progress or public rate limit
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: otp_unavailable when verification or the OTP store is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current token revoked
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All customer tokens revoked
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/me:
    get:
      operationId: showProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSuccess'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Inactive or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSuccess'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/me/addresses:
    get:
      operationId: listAddresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressList'
    post:
      operationId: createAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressWrite'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSuccess'
        '409':
          description: address_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation or address limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: address_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/me/addresses/{address}:
    parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: showAddress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSuccess'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateAddress
      description: >
        is_default true promotes this address. is_default false is rejected
        with validation_failed. POST may still send false because the first
        address is promoted automatically.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressPatch'
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSuccess'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: address_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failed, including is_default false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteAddress
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Address deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/medicines:
    get:
      operationId: searchMedicines
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          description: >
            Measured after catalog-text normalization. The normalized query must be 2 to 80 characters.
            Controlled medicines are excluded from this search.
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Distinct active, non-controlled medicine variants. An alias shared by several medicines returns each variant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicineSearchResult'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: forbidden or account_inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: validation_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/availability:
    get:
      operationId: nearbyAvailability
      description: >
        Pharmacies that can pick up every selected medicine near one location.
        distance_meters is straight-line distance, not driving distance or travel time.
        Stock and price require later pharmacy confirmation and are not a reservation.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: medicine_ids[]
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 10
            items:
              type: string
              format: uuid
        - in: query
          name: address_id
          schema:
            type: string
            format: uuid
        - in: query
          name: latitude
          schema:
            type: string
        - in: query
          name: longitude
          schema:
            type: string
        - in: query
          name: radius_meters
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 10000
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One paginated result set for the list and the map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResult'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: forbidden or account_inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: not_found when the address is missing or belongs to another customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: validation_failed, or medicine_unavailable when any selected medicine cannot be matched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/medicines/{medicine}/general-use:
    get:
      operationId: medicineGeneralUse
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: medicine
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved general-use text, or a statement that none is published. Draft text is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralUseResult'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown, inactive, or controlled medicine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/prescriptions:
    get:
      operationId: listPrescriptions
      description: >
        The caller's non-deleted prescriptions, 50 per page, ordered by created_at
        descending and then id descending. Follow next_cursor until has_more is false.
        The last page has a null next_cursor. A malformed or empty cursor is
        validation_failed and does not restart at the first page. Omit cursor for
        the first page. The cursor boundary keeps six fractional digits of created_at.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Opaque cursor returned as next_cursor. Omit it for the first page. An empty value is validation_failed.
      responses:
        '200':
          description: One page of the caller's prescriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionList'
        '422':
          description: validation_failed for a malformed cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: uploadPrescription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, or PDF. Content is checked. Maximum 8 MB. PDF is limited to 20 pages and is stored as the original attachment, not an inline preview. Extraction may remain unavailable.
                prescription_id:
                  type: string
                  format: uuid
                  description: When set, replaces the file and starts a new extraction version.
      responses:
        '201':
          description: Stored privately and queued for local extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResult'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: invalid_prescription_file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/prescriptions/{prescription}:
    get:
      operationId: showPrescription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
      responses:
        '200':
          description: Caller-owned prescription metadata and candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResult'
        '404':
          description: Missing or owned by someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deletePrescription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
      responses:
        '200':
          description: Customer access is removed. file_erasure is completed only after the private object is gone, otherwise pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionDeleted'
        '409':
          description: share_active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/prescriptions/{prescription}/file:
    get:
      operationId: readPrescriptionFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
      responses:
        '200':
          description: Authorized private attachment with no-store and nosniff. PDF is downloaded, not rendered inline. Not a public or presigned URL.
        '404':
          description: Missing or not accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/prescriptions/{prescription}/items/{item}:
    patch:
      operationId: correctPrescriptionItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
        - in: path
          name: item
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectPrescriptionItem'
      responses:
        '200':
          description: Correction stored. Any current pharmacist decision for the previous version is no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResult'
  /api/v1/prescriptions/{prescription}/share:
    post:
      operationId: sharePrescription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePrescription'
      responses:
        '200':
          description: Shared with one eligible pharmacy. This is not an order or a reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResult'
        '422':
          description: pharmacy_unavailable or validation_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/prescriptions/{prescription}/withdraw:
    post:
      operationId: withdrawPrescription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
      responses:
        '200':
          description: Pharmacy access removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResult'
components:
  parameters:
    PrescriptionId:
      in: path
      name: prescription
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MedicineVariant:
      type: object
      required: [id, generic_name, brand_name, strength, dosage_form, manufacturer, prescription_required]
      properties:
        id:
          type: string
          format: uuid
        generic_name:
          type: string
        brand_name:
          type: string
          nullable: true
        strength:
          type: string
          nullable: true
        dosage_form:
          type: string
        manufacturer:
          type: string
          nullable: true
        prescription_required:
          type: boolean
    MedicineSearchResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MedicineVariant'
        meta:
          type: object
          required: [request_id, page, per_page, has_more]
          properties:
            request_id:
              type: string
            page:
              type: integer
            per_page:
              type: integer
            has_more:
              type: boolean
    AvailabilityMedicine:
      type: object
      required: [id, generic_name, brand_name, strength, dosage_form, manufacturer, prescription_required, stock_status, unit_price_paisa, last_verified_at]
      properties:
        id:
          type: string
          format: uuid
        generic_name:
          type: string
        brand_name:
          type: string
          nullable: true
        strength:
          type: string
          nullable: true
        dosage_form:
          type: string
        manufacturer:
          type: string
          nullable: true
        prescription_required:
          type: boolean
        stock_status:
          type: string
          enum: [in_stock, low_stock]
        unit_price_paisa:
          type: integer
          minimum: 0
        last_verified_at:
          type: string
          format: date-time
    PharmacyAvailability:
      type: object
      required: [id, name, address, latitude, longitude, distance_meters, distance_method, open_now, medicines]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        distance_meters:
          type: integer
          description: Straight-line distance in meters. Not driving distance or travel time.
        distance_method:
          type: string
          enum: [straight_line]
        open_now:
          type: boolean
          nullable: true
          description: Null when the pharmacy has no operating-hour rows. Missing hours are unknown, not closed.
        medicines:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityMedicine'
    AvailabilityResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PharmacyAvailability'
        meta:
          type: object
          required: [request_id, page, per_page, has_more, radius_meters, freshness_hours, distance_method, confirmation]
          properties:
            request_id:
              type: string
            page:
              type: integer
            per_page:
              type: integer
            has_more:
              type: boolean
            radius_meters:
              type: integer
            freshness_hours:
              type: integer
            distance_method:
              type: string
              enum: [straight_line]
            confirmation:
              type: string
    RequestMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          format: uuid
    ValidationDetails:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    ErrorBody:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: '#/components/schemas/ValidationDetails'
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    OtpRequestBody:
      type: object
      required: [phone_number]
      properties:
        phone_number:
          type: string
    OtpVerifyBody:
      type: object
      required: [phone_number, challenge_id, otp]
      properties:
        phone_number:
          type: string
        challenge_id:
          type: string
          format: uuid
        otp:
          type: string
    OtpRequestData:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_in, retry_after]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_in:
          type: integer
          example: 300
        retry_after:
          type: integer
          example: 60
    OtpRequestSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/OtpRequestData'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    Customer:
      type: object
      additionalProperties: false
      required: [id, phone_masked, phone_verified_at, full_name, email, role, status]
      properties:
        id:
          type: string
          format: uuid
        phone_masked:
          type: string
          example: '+92300***4567'
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
        full_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
        status:
          type: string
    CustomerSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    OtpVerificationData:
      type: object
      required: [access_token, token_type, expires_at, customer]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_at:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/Customer'
    OtpVerificationSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/OtpVerificationData'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    Address:
      type: object
      additionalProperties: false
      required: [id, label, address_text, latitude, longitude, place_id, is_default, city]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        address_text:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        place_id:
          type: string
          nullable: true
        is_default:
          type: boolean
        city:
          type: string
    AddressSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Address'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    AddressListData:
      type: object
      required: [addresses]
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
    AddressList:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AddressListData'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    AddressWrite:
      type: object
      additionalProperties: false
      required: [label, address_text, latitude, longitude]
      properties:
        label:
          type: string
          maxLength: 60
        address_text:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        place_id:
          type: string
          nullable: true
        is_default:
          type: boolean
    AddressPatch:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 60
        address_text:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        place_id:
          type: string
          nullable: true
        is_default:
          type: boolean
          description: Only true is accepted. false is validation_failed.
    GeneralUseResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [available, general_use, safety_disclaimer]
          properties:
            available:
              type: boolean
            general_use:
              type: string
              nullable: true
            safety_disclaimer:
              type: string
        meta:
          $ref: '#/components/schemas/RequestMeta'
    PrescriptionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Prescription'
        meta:
          allOf:
            - $ref: '#/components/schemas/RequestMeta'
            - type: object
              required: [has_more, next_cursor]
              properties:
                has_more:
                  type: boolean
                next_cursor:
                  type: string
                  nullable: true
                  description: Present when another page exists. Null on the final page.
    PrescriptionResult:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Prescription'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    PrescriptionDeleted:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [deleted, file_erasure]
          properties:
            deleted:
              type: boolean
              description: Customer access has been removed. This does not by itself mean the private file is gone.
            file_erasure:
              type: string
              enum: [pending, completed]
        meta:
          $ref: '#/components/schemas/RequestMeta'
    Prescription:
      type: object
      required: [id, extraction_state, failure_code, status_text, share_state, items, safety_notice, verification_scope]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        mime_type:
          type: string
        byte_size:
          type: integer
        extraction_state:
          type: string
          enum: [queued, processing, completed, failed]
        failure_code:
          type: string
          nullable: true
          description: not_extracted means the file was stored and not read. pdf_not_extracted means a PDF was stored without text extraction. provider_not_approved means no live reader is configured. A completed state with no items is a finished read that found no lines.
        status_text:
          type: string
        content_version:
          type: integer
        share_state:
          type: string
          enum: [none, pending, verified, rejected, withdrawn]
        share_mode:
          type: string
          nullable: true
          enum: [selected_items, full_image]
        pharmacy_verified:
          type: boolean
        full_image_contents_identified:
          type: boolean
          enum: [false]
        items:
          type: array
          items:
            type: object
        availability:
          type: object
        safety_notice:
          type: string
        verification_scope:
          type: string
    CorrectPrescriptionItem:
      type: object
      additionalProperties: false
      required: [selected]
      properties:
        text:
          type: string
          nullable: true
          maxLength: 180
        selected:
          type: boolean
        selected_medicine_id:
          type: string
          format: uuid
          nullable: true
    SharePrescription:
      type: object
      additionalProperties: false
      required: [mode, pharmacy_id]
      properties:
        mode:
          type: string
          enum: [selected_items, full_image]
        pharmacy_id:
          type: string
          format: uuid
